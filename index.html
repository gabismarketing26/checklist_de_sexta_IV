<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHECKLIST: Gerenciador de Postagens por Dia</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --primary: #2e7d9e;
      --primary-hover: #256682;
      --accent: #b04f3f;
      --border-color: #e2e8f0;
      --success: #38a169;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px;
    }

    header {
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 16px;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Barra de Progresso */
    .progress-wrapper {
      margin: 20px 0;
      background: #f8fafc;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .progress-container {
      background: #edf2f7;
      border-radius: 20px;
      height: 14px;
      overflow: hidden;
      position: relative;
      margin-top: 8px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--success);
      transition: width 0.3s ease;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 600;
    }

    /* Controles e Filtros por Dia */
    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .filter-btn.highlight {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-btn.highlight.active {
      background: var(--accent);
      color: white;
    }

    /* Ações e Busca */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      padding: 9px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .reset-btn {
      padding: 9px 16px;
      background-color: #fff5f5;
      color: #c53030;
      border: 1px solid #feb2b2;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background-color: #fed7d7;
    }

    /* Tabela Visual */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #f8fafc;
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    tr.completed {
      background-color: #f0fff4;
      opacity: 0.65;
    }

    tr.completed td {
      text-decoration: line-through;
    }

    tr.completed td:first-child {
      text-decoration: none;
    }

    .checkbox-cell {
      width: 40px;
      text-align: center;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--success);
    }

    .badge-freq {
      background: #edf2f7;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .badge-time {
      background: #e2e8f0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-days {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
    }

    .capa-info {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .empty-msg {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-style: italic;
    }

    @media (max-width: 768px) {
      .container { padding: 16px; }
      th, td { padding: 10px; font-size: 0.85rem; }
      .action-bar { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📋 CHECKLIST: Clientes do Fim de Semana</h1>
    <p class="subtitle">Gerenciamento dinâmico de postagens por dia da semana e progresso individual</p>
  </header>

  <!-- Filtros de Dias da Semana -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setDayFilter('all', this)">Todos</button>
    <button class="filter-btn highlight" onclick="setDayFilter('fim-de-semana', this)">🔥 Fim de Semana (Sex-Seg)</button>
    <button class="filter-btn" onclick="setDayFilter('Seg', this)">Segunda</button>
    <button class="filter-btn" onclick="setDayFilter('Ter', this)">Terça</button>
    <button class="filter-btn" onclick="setDayFilter('Qua', this)">Quarta</button>
    <button class="filter-btn" onclick="setDayFilter('Qui', this)">Quinta</button>
    <button class="filter-btn" onclick="setDayFilter('Sex', this)">Sexta</button>
    <button class="filter-btn" onclick="setDayFilter('Sáb', this)">Sábado</button>
    <button class="filter-btn" onclick="setDayFilter('Dom', this)">Domingo</button>
  </div>

  <!-- Barra de Progresso da Visualização Atual -->
  <div class="progress-wrapper">
    <div class="progress-stats">
      <span id="progress-title">Progresso da Visualização (Todos os Clientes)</span>
      <span id="progress-text">0 de 0 concluídos (0%)</span>
    </div>
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <!-- Barra de Ações e Busca -->
  <div class="action-bar">
    <input type="text" id="search" class="search-box" placeholder="Buscar cliente por nome...">
    <button class="reset-btn" onclick="clearCurrentChecklist()">🔄 Limpar Checks Desta Visualização</button>
  </div>

  <!-- Tabela -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th class="checkbox-cell">Check</th>
          <th>Cliente</th>
          <th>Frequência</th>
          <th>Dias Programados</th>
          <th>Horário</th>
          <th>Orientação de Capa</th>
        </tr>
      </thead>
      <tbody id="checklist-body">
        <!-- Preenchido dinamicamente pelo JS -->
      </tbody>
    </table>
  </div>
</div>

<script>
  // Mapeamento Completo da Base de Dados
  const todosClientes = [
    { id: 1, nome: "Amanda Barcelos", frequencia: "4 por semana", dias: "Seg, Qua, Sex, Sáb", horario: "09:00", capa: "Print do próprio vídeo, exceto quando já houver capa enviada" },
    { id: 2, nome: "Aline Guedes", frequencia: "4 por semana", dias: "Ter, Qua, Qui, Sex", horario: "09:00", capa: "Print do próprio vídeo" },
    { id: 3, nome: "Beatriz Pelli", frequencia: "5 por semana", dias: "Seg a Sex", horario: "09:00", capa: "—" },
    { id: 4, nome: "Carmen Vera", frequencia: "14 por semana", dias: "Todos os dias", horario: "12:00 e 18:00", capa: "Print do próprio vídeo" },
    { id: 5, nome: "Dani Leite", frequencia: "Todos os dias", dias: "Todos os dias", horario: "17:00", capa: "Capinha obrigatória, já subida pelo editor" },
    { id: 6, nome: "Dra Luciana / Sisters", frequencia: "5 por semana", dias: "Seg a Sex", horario: "09:00", capa: "Capinha com texto, feita pela designer" },
    { id: 7, nome: "Fiamma", frequencia: "Todos os dias", dias: "Todos os dias", horario: "09:00", capa: "Print do próprio vídeo" },
    { id: 8, nome: "Dra Tamiris Marques", frequencia: "5 por semana", dias: "—", horario: "09:00", capa: "Capinha com texto, feita pela designer ou editor" },
    { id: 9, nome: "Isadora Vaz", frequencia: "Sem definição", dias: "—", horario: "—", capa: "Capinha" },
    { id: 10, nome: "Isabela Clerot", frequencia: "5 por semana", dias: "Seg a Sex", horario: "07:00", capa: "Print do próprio vídeo" },
    { id: 11, nome: "Jéssica Penaforte", frequencia: "3 por semana", dias: "Seg, Qua, Sex (+ Sáb leve)", horario: "17:00", capa: "Capinha com texto (exceto vídeos de lifestyle)" },
    { id: 12, nome: "Juh Araújo", frequencia: "5 por semana", dias: "Seg, Ter, Qua, Qui, Sáb", horario: "18:00", capa: "Capinha sem texto, o editor pega" },
    { id: 13, nome: "Kalessandra Castro", frequencia: "5 por semana", dias: "Seg a Sex", horario: "09:00", capa: "—" },
    { id: 14, nome: "Maria Petry", frequencia: "6 por semana", dias: "6 na semana (1 dia livre)", horario: "09:00", capa: "Capinha com texto, o editor pega" },
    { id: 15, nome: "Marina Vicente", frequencia: "4 por semana", dias: "Seg, Qua, Sex, Sáb", horario: "09:00", capa: "Capinha/print. Sempre com headline" },
    { id: 16, nome: "Márcia Campos", frequencia: "Todos os dias", dias: "Todos os dias", horario: "09:00", capa: "Print do próprio vídeo" },
    { id: 17, nome: "Suzi Nutrição", frequencia: "Sem definição", dias: "—", horario: "—", capa: "—" },
    { id: 18, nome: "Patrícia Domingos", frequencia: "Todos os dias", dias: "Todos os dias (inclui domingo)", horario: "09:00", capa: "Print do próprio vídeo" },
    { id: 19, nome: "Nicolas Charão", frequencia: "9 por semana", dias: "Todos os dias (mais de 1/dia)", horario: "12:00 e 18:00", capa: "Capinha ou print do próprio vídeo" },
    { id: 20, nome: "Pedro Coelho", frequencia: "3 por semana", dias: "Seg, Qua, Sex", horario: "08:00", capa: "Print do próprio vídeo" },
    { id: 21, nome: "Raiane", frequencia: "Todos os dias", dias: "Todos os dias", horario: "17:40", capa: "Print do próprio vídeo" },
    { id: 22, nome: "Raquel Conde", frequencia: "3 por semana", dias: "Seg, Qua, Sex", horario: "09:00", capa: "Print do próprio vídeo" },
    { id: 23, nome: "Rebeca Louise", frequencia: "5 por semana", dias: "Seg a Sex", horario: "09:00", capa: "Capinha" },
    { id: 24, nome: "Rodrigo Comunian", frequencia: "Todos os dias", dias: "—", horario: "11:00", capa: "—" },
    { id: 25, nome: "Tati Gastão", frequencia: "4 por semana", dias: "Seg/Ter a Sex", horario: "09:00", capa: "Print do próprio vídeo" },
    { id: 26, nome: "Jin Park", frequencia: "5 por semana", dias: "Seg a Sex", horario: "09:00", capa: "Print do vídeo" }
  ];

  // Armazenador de Estados dos Checks para cada Filtro de Dia
  // Estrutura: { 'all': { id1: true, id2: false }, 'Sex': { id1: true }, ... }
  const checkStates = {};

  let currentFilter = 'all';
  let currentSearch = '';

  // Nomes amigáveis dos filtros para o título do progresso
  const nombresFiltros = {
    'all': 'Todos os Clientes',
    'fim-de-semana': 'Fim de Semana (Sexta a Segunda)',
    'Seg': 'Segunda-feira',
    'Ter': 'Terça-feira',
    'Qua': 'Quarta-feira',
    'Qui': 'Quinta-feira',
    'Sex': 'Sexta-feira',
    'Sáb': 'Sábado',
    'Dom': 'Domingo'
  };

  // Avalia se o cliente deve aparecer no dia/filtro ativo
  function clientePertenceAoFiltro(cliente, filtro) {
    if (filtro === 'all') return true;

    const dias = cliente.dias.toLowerCase();
    const freq = cliente.frequencia.toLowerCase();

    // Filtro especial de Fim de Semana
    if (filtro === 'fim-de-semana') {
      const temDiaFDS = ["sex", "sáb", "sab", "dom", "seg", "todos os dias", "seg a sex", "seg/ter a sex", "6 na semana"].some(d => dias.includes(d));
      if (dias !== "—" && dias !== "") return temDiaFDS;
      return freq.includes("todos os dias") || freq.includes("6 por semana") || freq.includes("5 por semana");
    }

    // Filtros por dias individuais
    const f = filtro.toLowerCase();

    // Se dias for nulo ("—"), considera a frequência de produção diária/útil
    if (dias === '—') {
      if (freq.includes("todos os dias")) return true;
      if ((f === 'seg' || f === 'ter' || f === 'qua' || f === 'qui' || f === 'sex') && freq.includes("5 por semana")) return true;
      if (freq.includes("6 por semana") && f !== 'dom') return true;
      return false;
    }

    // Checagem direta na string dos dias
    if (dias.includes("todos os dias")) return true;
    if (dias.includes(f)) return true;
    if (f === 'sáb' && dias.includes('sab')) return true;

    // Intervalos como "Seg a Sex" ou "Seg/Ter a Sex"
    if (dias.includes("seg a sex") || dias.includes("seg/ter a sex")) {
      return ['seg', 'ter', 'qua', 'qui', 'sex'].includes(f);
    }

    if (dias.includes("6 na semana") && f !== 'dom') return true;

    return false;
  }

  // Renderizar Tabela
  function renderTable() {
    const tbody = document.getElementById('checklist-body');
    tbody.innerHTML = '';

    // Filtrar dados
    const clientesFiltrados = todosClientes.filter(c => {
      const bateFiltro = clientePertenceAoFiltro(c, currentFilter);
      const bateBusca = c.nome.toLowerCase().includes(currentSearch.toLowerCase());
      return bateFiltro && bateBusca;
    });

    if (clientesFiltrados.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty-msg">Nenhum cliente encontrado para este dia ou busca.</td></tr>`;
      updateProgress(0, 0);
      return;
    }

    // Garantir estrutura de estados do filtro atual
    if (!checkStates[currentFilter]) {
      checkStates[currentFilter] = {};
    }

    let checkedCount = 0;

    clientesFiltrados.forEach((cliente) => {
      const isChecked = !!checkStates[currentFilter][cliente.id];
      if (isChecked) checkedCount++;

      const row = document.createElement('tr');
      row.className = isChecked ? 'completed' : '';
      row.innerHTML = `
        <td class="checkbox-cell">
          <input type="checkbox" 
                 ${isChecked ? 'checked' : ''} 
                 onchange="toggleCheck(${cliente.id}, this)">
        </td>
        <td><strong>${cliente.nome}</strong></td>
        <td><span class="badge-freq">${cliente.frequencia}</span></td>
        <td><span class="badge-days">${cliente.dias !== '—' ? cliente.dias : '<em>Verificar Frequência</em>'}</span></td>
        <td><span class="badge-time">${cliente.horario}</span></td>
        <td class="capa-info">${cliente.capa}</td>
      `;
      tbody.appendChild(row);
    });

    updateProgress(checkedCount, clientesFiltrados.length);
  }

  // Marcar/Desmarcar CheckBox
  function toggleCheck(clienteId, checkboxElement) {
    if (!checkStates[currentFilter]) {
      checkStates[currentFilter] = {};
    }

    checkStates[currentFilter][clienteId] = checkboxElement.checked;
    renderTable();
  }

  // Atualizar Progresso Visual
  function updateProgress(checked, total) {
    const percentage = total === 0 ? 0 : Math.round((checked / total) * 100);
    document.getElementById('progress-bar').style.width = `${percentage}%`;
    document.getElementById('progress-text').innerText = `${checked} de ${total} concluídos (${percentage}%)`;
    document.getElementById('progress-title').innerText = `Progresso: ${nombresFiltros[currentFilter] || 'Dia Selecionado'}`;
  }

  // Alterar Filtro de Dia
  function setDayFilter(filtro, element) {
    currentFilter = filtro;

    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');

    renderTable();
  }

  // Limpar Checks da Visualização Ativa
  function clearCurrentChecklist() {
    if (confirm(`Tem certeza de que deseja limpar os checks do dia "${nombresFiltros[currentFilter]}"?`)) {
      checkStates[currentFilter] = {};
      renderTable();
    }
  }

  // Event Listener para Busca em Tempo Real
  document.getElementById('search').addEventListener('input', (e) => {
    currentSearch = e.target.value;
    renderTable();
  });

  // Inicialização
  renderTable();
</script>

</body>
</html>
