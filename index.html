<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHECKLIST: Clientes do Fim de Semana</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --primary: #2e7d9e;
      --primary-hover: #256682;
      --accent: #b04f3f;
      --border-color: #e2e8f0;
      --success: #38a169;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px;
    }

    header {
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 16px;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Barra de Progresso */
    .progress-container {
      margin: 20px 0;
      background: #edf2f7;
      border-radius: 20px;
      height: 12px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--success);
      transition: width 0.3s ease;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
    }

    /* Controles e Filtros */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Tabela Visual */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #f8fafc;
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    tr.completed {
      background-color: #f0fff4;
      opacity: 0.6;
    }

    tr.completed td {
      text-decoration: line-through;
    }

    tr.completed td:first-child {
      text-decoration: none;
    }

    .checkbox-cell {
      width: 40px;
      text-align: center;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--success);
    }

    .badge-time {
      background: #e2e8f0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-days {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
    }

    .capa-info {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .container { padding: 16px; }
      th, td { padding: 10px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📋 CHECKLIST: Clientes do Fim de Semana</h1>
    <p class="subtitle">Prioridades para conferência e agendamento na sexta-feira (Sexta a Segunda)</p>
  </header>

  <!-- Barra de Progresso -->
  <div class="progress-wrapper">
    <div class="progress-stats">
      <span>Progresso do Checklist</span>
      <span id="progress-text">0 de 0 concluídos (0%)</span>
    </div>
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <!-- Controles -->
  <div class="controls">
    <input type="text" id="search" class="search-box" placeholder="Buscar cliente...">
    <button class="filter-btn active" onclick="filterTable('all')">Todos</button>
    <button class="filter-btn" onclick="filterTable('Sab')">Sábado</button>
    <button class="filter-btn" onclick="filterTable('Dom')">Domingo</button>
    <button class="filter-btn" onclick="filterTable('Seg')">Segunda</button>
  </div>

  <!-- Tabela -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th class="checkbox-cell">Status</th>
          <th>Cliente</th>
          <th>Dias de Postagem</th>
          <th>Horário</th>
          <th>Orientação de Capa</th>
        </tr>
      </thead>
      <tbody id="checklist-body">
        <!-- Inserido via JavaScript -->
      </tbody>
    </table>
  </div>
</div>

<script>
  // Dados Mapeados
  const clientes = [
    { nome: "Amanda Barcelos", dias: "Sex, Sáb, Seg", horario: "09:00", capa: "Print do vídeo (exceto se houver capa enviada)" },
    { nome: "Aline Guedes", dias: "Sex", horario: "09:00", capa: "Print do próprio vídeo" },
    { nome: "Beatriz Pelli", dias: "Sex, Seg", horario: "09:00", capa: "—" },
    { nome: "Carmen Vera", dias: "Todos os dias (Sex a Seg)", horario: "12:00 e 18:00", capa: "Print do próprio vídeo" },
    { nome: "Dani Leite", dias: "Todos os dias (Sex a Seg)", horario: "17:00", capa: "Capinha obrigatória (já subida pelo editor)" },
    { nome: "Dra Luciana / Sisters", dias: "Sex, Seg", horario: "09:00", capa: "Capinha com texto (feita pela designer)" },
    { nome: "Fiamma", dias: "Todos os dias (Sex a Seg)", horario: "09:00", capa: "Print do próprio vídeo" },
    { nome: "Isabela Clerot", dias: "Sex, Seg", horario: "07:00", capa: "Print do próprio vídeo" },
    { nome: "Jéssica Penaforte", dias: "Sex, Sáb (leve), Seg", horario: "17:00", capa: "Capinha com texto (exceto vídeos de lifestyle)" },
    { nome: "Juh Araújo", dias: "Qui a Sáb (Sex e Sáb)", horario: "18:00", capa: "Capinha sem texto (editor pega)" },
    { nome: "Kalessandra Castro", dias: "Sex, Seg", horario: "09:00", capa: "—" },
    { nome: "Marina Vicente", dias: "Sex, Sáb, Seg", horario: "09:00", capa: "Capinha/print. Sem carinha, sempre com headline" },
    { nome: "Márcia Campos", dias: "Todos os dias (Sex a Seg)", horario: "09:00", capa: "Print do próprio vídeo" },
    { nome: "Patrícia Domingos", dias: "Todos os dias (inclui Dom)", horario: "09:00", capa: "Print do próprio vídeo" },
    { nome: "Nicolas Charão", dias: "Todos os dias (+1/dia)", horario: "12:00 e 18:00", capa: "Conteúdos com capinha ou print do vídeo" },
    { nome: "Pedro Coelho", dias: "Sex, Seg", horario: "08:00", capa: "Print do próprio vídeo" },
    { nome: "Raiane", dias: "Todos os dias (Sex a Seg)", horario: "17:40", capa: "Print do próprio vídeo" },
    { nome: "Raquel Conde", dias: "Sex, Seg", horario: "09:00", capa: "Print do próprio vídeo" },
    { nome: "Rebeca Louise", dias: "Sex, Seg", horario: "09:00", capa: "Capinha" },
    { nome: "Tati Gastão", dias: "Sex, Seg", horario: "09:00", capa: "Print do próprio vídeo" },
    { nome: "Jin Park", dias: "Sex, Seg", horario: "09:00", capa: "Print do vídeo (orientação mudará em breve)" }
  ];

  const tbody = document.getElementById('checklist-body');
  const searchInput = document.getElementById('search');

  // Renderizar Tabela
  function renderTable(data) {
    tbody.innerHTML = '';
    data.forEach((cliente, index) => {
      const row = document.createElement('tr');
      row.id = `row-${index}`;
      row.innerHTML = `
        <td class="checkbox-cell">
          <input type="checkbox" onchange="toggleCheck(${index})" id="check-${index}">
        </td>
        <td><strong>${cliente.nome}</strong></td>
        <td><span class="badge-days">${cliente.dias}</span></td>
        <td><span class="badge-time">${cliente.horario}</span></td>
        <td class="capa-info">${cliente.capa}</td>
      `;
      tbody.appendChild(row);
    });
    updateProgress();
  }

  // Marcar/Desmarcar Concluído
  function toggleCheck(index) {
    const row = document.getElementById(`row-${index}`);
    const checkbox = document.getElementById(`check-${index}`);
    
    if (checkbox.checked) {
      row.classList.add('completed');
    } else {
      row.classList.remove('completed');
    }
    updateProgress();
  }

  // Atualizar Barra de Progresso
  function updateProgress() {
    const total = document.querySelectorAll('#checklist-body tr').length;
    const checked = document.querySelectorAll('#checklist-body input[type="checkbox"]:checked').length;
    const percentage = total === 0 ? 0 : Math.round((checked / total) * 100);

    document.getElementById('progress-bar').style.width = `${percentage}%`;
    document.getElementById('progress-text').innerText = `${checked} de ${total} concluídos (${percentage}%)`;
  }

  // Filtro de Busca por Nome
  searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = clientes.filter(c => c.nome.toLowerCase().includes(term));
    renderTable(filtered);
  });

  // Filtros Rápidos por Dia
  function filterTable(day) {
    // Atualizar classe ativa nos botões
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    if (day === 'all') {
      renderTable(clientes);
    } else {
      const filtered = clientes.filter(c => 
        c.dias.toLowerCase().includes(day.toLowerCase()) || 
        c.dias.toLowerCase().includes('todos')
      );
      renderTable(filtered);
    }
  }

  // Inicialização
  renderTable(clientes);
</script>

</body>
</html>
