<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHECKLIST: Clientes do Fim de Semana</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --primary: #2e7d9e;
      --primary-hover: #256682;
      --accent: #b04f3f;
      --border-color: #e2e8f0;
      --success: #38a169;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1150px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px;
    }

    header {
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 16px;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Barra de Progresso */
    .progress-wrapper {
      margin: 20px 0;
    }

    .progress-container {
      background: #edf2f7;
      border-radius: 20px;
      height: 12px;
      overflow: hidden;
      position: relative;
      margin-top: 6px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--success);
      transition: width 0.3s ease;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Controles e Filtros */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Tabela Visual */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #f8fafc;
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    tr.completed {
      background-color: #f0fff4;
      opacity: 0.6;
    }

    tr.completed td {
      text-decoration: line-through;
    }

    tr.completed td:first-child {
      text-decoration: none;
    }

    .checkbox-cell {
      width: 40px;
      text-align: center;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--success);
    }

    .badge-freq {
      background: #edf2f7;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .badge-time {
      background: #e2e8f0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-days {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
    }

    .capa-info {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .container { padding: 16px; }
      th, td { padding: 10px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📋 CHECKLIST: Clientes do Fim de Semana</h1>
    <p class="subtitle">Prioridades de verificação para o checklist de sexta-feira (Sexta a Segunda)</p>
  </header>

  <!-- Barra de Progresso -->
  <div class="progress-wrapper">
    <div class="progress-stats">
      <span>Progresso do Agendamento</span>
      <span id="progress-text">0 de 0 concluídos (0%)</span>
    </div>
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <!-- Controles -->
  <div class="controls">
    <input type="text" id="search" class="search-box" placeholder="Buscar cliente...">
    <button class="filter-btn active" onclick="filterTable('all')">Todos</button>
    <button class="filter-btn" onclick="filterTable('Sab')">Sábado</button>
    <button class="filter-btn" onclick="filterTable('Dom')">Domingo</button>
    <button class="filter-btn" onclick="filterTable('Seg')">Segunda</button>
  </div>

  <!-- Tabela -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th class="checkbox-cell">Status</th>
          <th>Cliente</th>
          <th>Frequência</th>
          <th>Dias de Postagem</th>
          <th>Horário</th>
          <th>Orientação de Capa</th>
        </tr>
      </thead>
      <tbody id="checklist-body">
        <!-- Inserido via JavaScript -->
      </tbody>
    </table>
  </div>
</div>

<script>
  // Mapeamento Completo de Clientes
  const todosClientes = [
    { nome: "Amanda Barcelos", frequencia: "4 por semana", dias: "Seg, Qua, Sex, Sáb", horario: "09:00", capa: "Print do próprio vídeo, exceto quando já houver capa enviada" },
    { nome: "Aline Guedes", frequencia: "4 por semana", dias: "Ter, Qua, Qui, Sex", horario: "09:00", capa: "Print do próprio vídeo" },
    { nome: "Beatriz Pelli", frequencia: "5 por semana", dias: "Seg a Sex", horario: "09:00", capa: "—" },
    { nome: "Carmen Vera", frequencia: "14 por semana", dias: "Todos os dias", horario: "12:00 e 18:00", capa: "Print do próprio vídeo" },
    { nome: "Dani Leite", frequencia: "Todos os dias", dias: "Todos os dias", horario: "17:00", capa: "Capinha obrigatória, já subida pelo editor" },
    { nome: "Dra Luciana / Sisters", frequencia: "5 por semana", dias: "Seg a Sex", horario: "09:00", capa: "Capinha com texto, feita pela designer" },
    { nome: "Fiamma", frequencia: "Todos os dias", dias: "Todos os dias", horario: "09:00", capa: "Print do próprio vídeo" },
    { nome: "Dra Tamiris Marques", frequencia: "5 por semana", dias: "—", horario: "09:00", capa: "Capinha com texto, feita pela designer ou editor" },
    { nome: "Isadora Vaz", frequencia: "Sem definição", dias: "—", horario: "—", capa: "Capinha" },
    { nome: "Isabela Clerot", frequencia: "5 por semana", dias: "Seg a Sex", horario: "07:00", capa: "Print do próprio vídeo" },
    { nome: "Jéssica Penaforte", frequencia: "3 por semana", dias: "Seg, Qua, Sex (+ Sáb leve)", horario: "17:00", capa: "Capinha com texto (exceto vídeos de lifestyle)" },
    { nome: "Juh Araújo", frequencia: "5 por semana", dias: "Seg, Ter, Qua, Qui, Sáb", horario: "18:00", capa: "Capinha sem texto, o editor pega" },
    { nome: "Kalessandra Castro", frequencia: "5 por semana", dias: "Seg a Sex", horario: "09:00", capa: "—" },
    { nome: "Maria Petry", frequencia: "6 por semana", dias: "6 na semana (1 dia livre)", horario: "09:00", capa: "Capinha com texto, o editor pega" },
    { nome: "Marina Vicente", frequencia: "4 por semana", dias: "Seg, Qua, Sex, Sáb", horario: "09:00", capa: "Capinha/print. Sempre com headline" },
    { nome: "Márcia Campos", frequencia: "Todos os dias", dias: "Todos os dias", horario: "09:00", capa: "Print do próprio vídeo" },
    { nome: "Suzi Nutrição", frequencia: "Sem definição", dias: "—", horario: "—", capa: "—" },
    { nome: "Patrícia Domingos", frequencia: "Todos os dias", dias: "Todos os dias (inclui domingo)", horario: "09:00", capa: "Print do próprio vídeo" },
    { nome: "Nicolas Charão", frequencia: "9 por semana", dias: "Todos os dias (mais de 1/dia)", horario: "12:00 e 18:00", capa: "Capinha ou print do próprio vídeo" },
    { nome: "Pedro Coelho", frequencia: "3 por semana", dias: "Seg, Qua, Sex", horario: "08:00", capa: "Print do próprio vídeo" },
    { nome: "Raiane", frequencia: "Todos os dias", dias: "Todos os dias", horario: "17:40", capa: "Print do próprio vídeo" },
    { nome: "Raquel Conde", frequencia: "3 por semana", dias: "Seg, Qua, Sex", horario: "09:00", capa: "Print do próprio vídeo" },
    { nome: "Rebeca Louise", frequencia: "5 por semana", dias: "Seg a Sex", horario: "09:00", capa: "Capinha" },
    { nome: "Rodrigo Comunian", frequencia: "Todos os dias", dias: "—", horario: "11:00", capa: "—" },
    { nome: "Tati Gastão", frequencia: "4 por semana", dias: "Seg/Ter a Sex", horario: "09:00", capa: "Print do próprio vídeo" },
    { nome: "Jin Park", frequencia: "5 por semana", dias: "Seg a Sex", horario: "09:00", capa: "Print do vídeo" }
  ];

  // Lógica de Filtro Inicial: Selecionar apenas quem atende os critérios de Sex a Seg
  function ehPrioridadeFimDeSemana(cliente) {
    const dias = cliente.dias.toLowerCase();
    const freq = cliente.frequencia.toLowerCase();

    // Palavras-chave dos dias de interesse
    const temDiaRelevante = ["sex", "sáb", "sab", "dom", "seg", "todos os dias", "seg a sex", "seg/ter a sex", "6 na semana"].some(d => dias.includes(d));

    // Se a coluna Dias tiver especificação e ela for relevante
    if (dias !== "—" && dias !== "") {
      return temDiaRelevante;
    }

    // Se a coluna Dias NÃO tiver especificação ("—"), avalia a Frequência
    if (freq.includes("todos os dias") || freq.includes("6 por semana") || freq.includes("5 por semana")) {
      return true;
    }

    return false;
  }

  // Filtrar Lista Inicial
  let clientesPrioridade = todosClientes.filter(ehPrioridadeFimDeSemana);

  const tbody = document.getElementById('checklist-body');
  const searchInput = document.getElementById('search');

  // Renderizar Tabela
  function renderTable(data) {
    tbody.innerHTML = '';
    data.forEach((cliente, index) => {
      const row = document.createElement('tr');
      row.id = `row-${index}`;
      row.innerHTML = `
        <td class="checkbox-cell">
          <input type="checkbox" onchange="toggleCheck(${index})" id="check-${index}">
        </td>
        <td><strong>${cliente.nome}</strong></td>
        <td><span class="badge-freq">${cliente.frequencia}</span></td>
        <td><span class="badge-days">${cliente.dias !== '—' ? cliente.dias : '<em>Verificar Frequência</em>'}</span></td>
        <td><span class="badge-time">${cliente.horario}</span></td>
        <td class="capa-info">${cliente.capa}</td>
      `;
      tbody.appendChild(row);
    });
    updateProgress();
  }

  // Marcar/Desmarcar Concluído
  function toggleCheck(index) {
    const row = document.getElementById(`row-${index}`);
    const checkbox = document.getElementById(`check-${index}`);
    
    if (checkbox.checked) {
      row.classList.add('completed');
    } else {
      row.classList.remove('completed');
    }
    updateProgress();
  }

  // Atualizar Barra de Progresso
  function updateProgress() {
    const total = document.querySelectorAll('#checklist-body tr').length;
    const checked = document.querySelectorAll('#checklist-body input[type="checkbox"]:checked').length;
    const percentage = total === 0 ? 0 : Math.round((checked / total) * 100);

    document.getElementById('progress-bar').style.width = `${percentage}%`;
    document.getElementById('progress-text').innerText = `${checked} de ${total} concluídos (${percentage}%)`;
  }

  // Filtro de Busca por Nome
  searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = clientesPrioridade.filter(c => c.nome.toLowerCase().includes(term));
    renderTable(filtered);
  });

  // Filtros Rápidos por Dia
  function filterTable(day) {
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    if (day === 'all') {
      renderTable(clientesPrioridade);
    } else {
      const filtered = clientesPrioridade.filter(c => {
        const dias = c.dias.toLowerCase();
        const freq = c.frequencia.toLowerCase();
        
        if (dias === '—') {
          return freq.includes('todos os dias') || freq.includes('5 por semana') || freq.includes('6 por semana');
        }
        
        return dias.includes(day.toLowerCase()) || 
               dias.includes('todos') || 
               (day === 'Seg' && (dias.includes('seg a sex') || dias.includes('seg/ter a sex'))) ||
               (day === 'Sex' && (dias.includes('seg a sex') || dias.includes('seg/ter a sex')));
      });
      renderTable(filtered);
    }
  }

  // Inicialização
  renderTable(clientesPrioridade);
</script>

</body>
</html>
